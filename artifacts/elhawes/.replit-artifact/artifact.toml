kind = "web"
previewPath = "/"
title = "El Hawes Travel"
version = "1.0.0"
id = "artifacts/elhawes"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18255

[services.development]
run = "pnpm --filter @workspace/elhawes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/elhawes", "run", "build" ]
publicDir = "artifacts/elhawes/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18255"
BASE_PATH = "/"
